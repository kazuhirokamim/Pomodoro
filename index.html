<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0c0e; --panel: #121417; --border: #23272e;
      --amber: #f5a623; --red: #e84545; --green: #39d98a;
      --text: #e8dfc8; --muted: #6c737f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'JetBrains Mono', monospace; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;
    }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3.8rem; letter-spacing: 0.06em; color: var(--amber); margin-bottom: 1rem; }
    .panel {
      width: 100%; max-width: 440px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; padding: 1.8rem;
    }
    .inputs { display: flex; justify-content: center; align-items: flex-end; gap: 0.5rem; margin-bottom: 1.5rem; }
    .field { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .field label, .stat span { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); }
    .field input {
      width: 68px; padding: 0.35rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--amber); font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; text-align: center;
    }
    .field input:focus { outline: none; border-color: var(--amber); }
    .field input:disabled { opacity: 0.4; }
    .sep { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; color: var(--muted); padding-bottom: 0.25rem; }
    #display {
      font-family: 'Bebas Neue', sans-serif; font-size: 4.8rem; letter-spacing: 0.05em;
      text-align: center; color: var(--amber); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; line-height: 1;
    }
    #display.urgent { color: var(--red); }
    .track { height: 5px; background: var(--border); border-radius: 99px; margin: 1rem 0 0.7rem; overflow: hidden; }
    #progress { height: 100%; width: 100%; background: var(--amber); transition: width 1s linear, background 0.3s; }
    #status { text-align: center; font-size: 0.75rem; color: var(--muted); min-height: 1.2em; }
    .controls { display: flex; gap: 0.6rem; justify-content: center; margin: 1.4rem 0; }
    button {
      font-family: inherit; font-size: 0.75rem; font-weight: 600; padding: 0.6rem 1.1rem;
      border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    #btn-start { background: var(--amber); color: var(--bg); border-color: var(--amber); }
    #btn-start:hover:not(:disabled) { filter: brightness(1.1); color: var(--bg); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; border-top: 1px solid var(--border); padding-top: 1.2rem; }
    .stat {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.8rem; display: flex; flex-direction: column; gap: 0.25rem;
    }
    .stat strong { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: var(--amber); font-weight: 400; }
    #btn-clear { font-size: 0.65rem; padding: 0.2rem 0.5rem; align-self: flex-start; color: var(--muted); }
    #btn-clear:hover { border-color: var(--red); color: var(--red); }
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--panel);
      border: 1px solid var(--amber); color: var(--amber); padding: 0.8rem 1.1rem;
      border-radius: 8px; font-size: 0.8rem; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <h1>Pomodoro</h1>

  <main class="panel">
    <div class="inputs">
      <div class="field"><label for="ih">Horas</label><input type="number" id="ih" min="0" max="23" value="0" /></div>
      <span class="sep">:</span>
      <div class="field"><label for="im">Min</label><input type="number" id="im" min="0" max="59" value="25" /></div>
      <span class="sep">:</span>
      <div class="field"><label for="iseg">Seg</label><input type="number" id="iseg" min="0" max="59" value="0" /></div>
    </div>

    <div id="display">00:25:00</div>
    <div class="track"><div id="progress"></div></div>
    <p id="status">Defina o tempo e clique em iniciar</p>

    <div class="controls">
      <button id="btn-start">Iniciar</button>
      <button id="btn-pause" disabled>Pausar</button>
      <button id="btn-reset">Reiniciar</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Ciclos concluídos</span>
        <strong id="cycles">0</strong>
        <button id="btn-clear">Zerar</button>
      </div>
      <div class="stat">
        <span>Tempo focado</span>
        <strong id="elapsed">00:00:00</strong>
      </div>
    </div>
  </main>

  <div id="toast">Ciclo concluído!</div>

  <script>
    const $ = id => document.getElementById(id);
    const inputs = [$('ih'), $('im'), $('iseg')];

    let total = 0, remaining = 0, timer = null, running = false;
    let cycles = parseInt(getCookie('pomodoro_cycles') || '0', 10);
    let elapsed = parseInt(getCookie('pomodoro_elapsed') || '0', 10);

    function setCookie(name, val, days) {
      try {
        const exp = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${val}; expires=${exp}; path=/`;
      } catch (e) {}
    }

    function getCookie(name) {
      try {
        const item = document.cookie.split('; ').find(r => r.startsWith(name + '='));
        return item ? item.split('=')[1] : null;
      } catch (e) { return null; }
    }

    function format(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      return [h, m, s % 60].map(v => String(v).padStart(2, '0')).join(':');
    }

    function getSeconds() {
      const [h, m, s] = inputs.map(i => Math.max(0, Math.min(Number(i.max), parseInt(i.value || '0', 10))));
      return h * 3600 + m * 60 + s;
    }

    function updateUI(secs, frac = 1) {
      $('display').textContent = format(secs);
      $('display').classList.toggle('urgent', running && frac <= 0.1);
      $('progress').style.width = (frac * 100) + '%';
      $('progress').style.background = frac > 0.5 ? 'var(--green)' : frac > 0.2 ? 'var(--amber)' : 'var(--red)';
    }

    function setRunning(state) {
      running = state;
      inputs.forEach(i => i.disabled = state);
      $('btn-start').disabled = state;
      $('btn-pause').disabled = !state;
    }

    function tick() {
      const t0 = Date.now();
      remaining--;
      elapsed++;

      updateUI(remaining, total > 0 ? remaining / total : 0);
      $('elapsed').textContent = format(elapsed);

      if (remaining <= 0) {
        setRunning(false);
        cycles++;
        setCookie('pomodoro_cycles', cycles, 365);
        setCookie('pomodoro_elapsed', elapsed, 365);
        $('cycles').textContent = cycles;
        $('status').textContent = `Ciclo ${cycles} concluído`;
        $('toast').textContent = `Ciclo ${cycles} finalizado. Hora de fazer uma pausa!`;
        $('toast').classList.add('show');
        setTimeout(() => $('toast').classList.remove('show'), 4000);
        return;
      }

      timer = setTimeout(tick, Math.max(0, 1000 - (Date.now() - t0)));
    }

    $('btn-start').addEventListener('click', () => {
      if (running) return;
      if (remaining <= 0) {
        total = getSeconds();
        if (total < 1) return ($('status').textContent = 'Insira pelo menos 1 segundo');
        remaining = total;
        updateUI(remaining, 1);
      }
      setRunning(true);
      $('status').textContent = 'Em andamento...';
      timer = setTimeout(tick, 1000);
    });

    $('btn-pause').addEventListener('click', () => {
      clearTimeout(timer);
      setRunning(false);
      $('status').textContent = 'Pausado';
    });

    $('btn-reset').addEventListener('click', () => {
      clearTimeout(timer);
      setRunning(false);
      total = remaining = getSeconds();
      updateUI(remaining, total > 0 ? 1 : 0);
      $('status').textContent = 'Tempo reiniciado';
    });

    $('btn-clear').addEventListener('click', () => {
      cycles = 0;
      setCookie('pomodoro_cycles', 0, -1);
      $('cycles').textContent = 0;
      $('status').textContent = 'Contador de ciclos zerado';
    });

    inputs.forEach(input => {
      input.addEventListener('input', () => {
        if (!running && remaining === 0) {
          const s = getSeconds();
          updateUI(s, s > 0 ? 1 : 0);
        }
      });
    });

    $('cycles').textContent = cycles;
    $('elapsed').textContent = format(elapsed);
    updateUI(getSeconds(), 1);
  </script>
</body>
</html>
